# Reference-only pyproject fragments for optional automation tooling.
# Merge these into pyproject.toml deliberately; do not replace the existing
# project metadata. The authoritative package source is `src/crewplane`, and the
# supported Python floor is 3.13.

[project.optional-dependencies]
docs = [
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.6.0",
]

security = [
  "pip-audit>=2.9.0",
]

automation = [
  "pre-commit>=4.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E", "F", "I", "B", "UP", "SIM", "ARG",
]
ignore = [
  "E501",
  "B008",
]
dummy-variable-rgx = "^$"

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["crewplane"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0

site_name: Crewplane
site_description: A CLI-first control plane for resumable coding-agent workflows.
site_url: https://crewplaneai.github.io/crewplane/
repo_url: https://github.com/crewplaneai/crewplane
repo_name: crewplaneai/crewplane
edit_uri: edit/master/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

exclude_docs: |
  /maintainers/

validation:
  nav:
    omitted_files: info
  links:
    not_found: info
    anchors: info
    absolute_links: info
    unrecognized_links: info

nav:
  - Home: index.md
  - Getting Started:
      - Why Crewplane: getting-started/why-crewplane.md
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Provider Setup: getting-started/provider-setup.md
  - Guides:
      - Running Workflows: guides/running-workflows.md
      - Watch Runs Live and Inspect Results: guides/watch-runs-live-and-inspect-results.md
      - Inspecting Run Records: guides/inspecting-artifacts.md
      - Workflow Authoring: guides/workflow-authoring.md
      - Node Modes and Provider Roles: guides/node-modes.md
      - Review Loops: guides/review-loops.md
      - Findings Artifacts: guides/findings.md
      - Workflow Composition: guides/workflow-composition.md
      - Workspace Isolation: guides/workspace-isolation.md
      - Mock Validation: guides/mock-validation.md
      - Troubleshooting: guides/troubleshooting.md
      - Reproducible Support Bundle: guides/reproducible-support-bundle.md
      - Cleanup: guides/cleanup.md
  - Examples:
      - Example Templates: examples/index.md
      - Composition Examples: examples/composition.md
      - Workspace Examples: examples/workspace.md
  - Reference:
      - Commands: reference/commands.md
      - Configuration: reference/configuration.md
      - Workflow Syntax: reference/workflow-syntax.md
      - Integrations: reference/integrations.md
      - Artifacts: reference/artifacts.md
  - Architecture:
      - Overview: architecture/index.md
      - Modular Orchestration: architecture/modular-orchestration-architecture.md
      - UI Compact Dashboard: architecture/ui_compact_dashboard.md
      - ADRs:
          - Ports and Adapters: architecture/adr/0001-ports-adapters-runtime-integrations.md
          - Auto-Sized Tmux Log Tail: architecture/adr/0002-auto-sized-tmux-log-tail.md
          - Mock Invoker: architecture/adr/0003-mock-invoker.md
          - Log Streaming: architecture/adr/0004-log-streaming.md
          - Workflow Validation: architecture/adr/0005-deeper-workflow-validation.md
          - Workflow Composition Primitives: architecture/adr/0006-workflow-composition-primitives.md
          - Template Reference Failures: architecture/adr/0007-template-reference-failures.md
          - Corrupt Manifest Skip Behavior: architecture/adr/0008-corrupt-manifest-skip-behavior.md
          - Context Hash Idempotency: architecture/adr/0009-context-hash-idempotency.md
          - Core Positioning: architecture/adr/0010-core-positioning-infrastructure-as-code.md
          - Review Execution Optimization: architecture/adr/0011-review-execution-workflow-optimization.md
          - Preflight Execution Plan: architecture/adr/0012-preflight-compiled-runtime-execution-plan.md
          - Version Source of Truth: architecture/adr/0013-version-source-of-truth-and-documentation-drift-reduction.md
          - Node-Boundary Resume: architecture/adr/0014-artifact-backed-node-boundary-resume.md
          - Provider Log Presentation: architecture/adr/0015-display-only-provider-log-presentation.md
          - Node-Scoped Workspace Isolation: architecture/adr/0016-node-scoped-git-workspace-isolation.md

[project]
name = "crewplane"
version = "0.3.9"
description = "A provider-neutral CLI-first control plane for human-designed coding-agent workflows"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "crewplane-ollama>=0.2.0,<0.3",
    "typer>=0.12.0",
    "click>=8.0.0",
    "shellingham>=1.3.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "markdown-it-py>=4.0",
    "rich>=13.0",
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1,<1",
    "build>=1.3",
    "mypy>=1.18",
    "packaging>=24.0",
    "pytest>=9.1",
    "pytest-cov>=7.0",
    "pytest-xdist>=3.8",
    "ruff>=0.6",
    "twine>=6.0",
    "types-PyYAML>=6.0.12",
]
stress = [
    "pytest-randomly>=4.0.1",
]

[project.scripts]
crewplane = "crewplane.cli.app:app"

[project.urls]
Homepage = "https://github.com/crewplaneai/crewplane"
Repository = "https://github.com/crewplaneai/crewplane"
Issues = "https://github.com/crewplaneai/crewplane/issues"
Documentation = "https://github.com/crewplaneai/crewplane/blob/master/docs/index.md"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewplane"]
include = [
    "src/crewplane/py.typed",
    "src/crewplane/example_templates/*.yml",
    "src/crewplane/example_templates/*.yaml",
    "src/crewplane/example_templates/*.md",
    "src/crewplane/example_templates/**/*.yml",
    "src/crewplane/example_templates/**/*.yaml",
    "src/crewplane/example_templates/**/*.md",
]

[tool.hatch.build.targets.sdist]
only-include = [
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "src/crewplane",
    "plugins/crewplane-ollama",
]

[tool.uv.sources]
crewplane-ollama = { path = "plugins/crewplane-ollama", editable = true }

[tool.crewplane.release]
plugins = ["plugins/crewplane-ollama"]

# Shared validation policy is read by scripts/validation_policy.py. Make and CI
# must consume it rather than copy defaults. Durations below are in seconds;
# GitHub job limits are derived in whole minutes, rounded up.
[tool.crewplane.validation.coverage]
statement_floor = 96
branch_floor = 90

[tool.crewplane.validation.timeouts]
# These caps share the test phase deadline; reporting cannot restart the clock.
metadata_seconds = 10
coverage_report_seconds = 120
coverage_gate_seconds = 30
plugin_seconds = 300
# Graceful termination and final reaping serve different purposes. A small
# command-line shutdown override must not reduce the final reaping allowance.
shutdown_seconds = 5
reap_seconds = 5
process_snapshot_seconds = 1
# One budget covers all package commands, including builds and installed smokes.
package_seconds = 900
package_overhead_seconds = 300
wheel_command_seconds = 300
installed_command_seconds = 180
# Windows wheel acceptance shares the native test job's ten-minute allowance.
native_package_seconds = 300
race_iteration_seconds = 90
race_overhead_seconds = 150
# Local async test watchdogs bound readiness, the scenario, and owned-task cleanup.
readiness_seconds = 5
scenario_seconds = 15
cleanup_seconds = 5

[tool.crewplane.validation.runner]
default_profile = "local"
duration_count = 20
race_iterations = 5
# Worker restarts would hide crashes; retain the standard load scheduler.
worker_distribution = "load"
max_worker_restart = 0

[tool.crewplane.validation.fuzz]
total_seconds = 30
input_seconds = 5
overhead_seconds = 150
max_length = 4096
rss_limit_mb = 2048

# Phase limits include metadata, core tests, coverage reports, and selected
# plugin tests. Job allowances cover dependency setup, cleanup, and uploads;
# Linux also runs the short fuzz check, Windows runs installed-wheel acceptance.
[tool.crewplane.validation.platforms.linux]
test_seconds = 1500
job_overhead_seconds = 300
local_workers = 2
local_parallel_python = ["3.13", "3.14"]

[tool.crewplane.validation.platforms.darwin]
test_seconds = 2100
job_overhead_seconds = 600
local_workers = 0
local_parallel_python = []

[tool.crewplane.validation.platforms.win32]
test_seconds = 2100
job_overhead_seconds = 600
local_workers = 0
local_parallel_python = []

# Profiles inherit these defaults. Parallel execution is enabled locally only
# on platforms and Python versions with acceptance evidence listed above.
[tool.crewplane.validation.profile_defaults]
workers = 0
coverage = false
required_git = true
marker_expression = ""
random_shuffle = false
platform_workers = false

[tool.crewplane.validation.profiles.local]
coverage = true
required_git = false
platform_workers = true

[tool.crewplane.validation.profiles.pr-313]
coverage = true
shuffle_seed = 1729

[tool.crewplane.validation.profiles.pr-314]
coverage = true

[tool.crewplane.validation.profiles.testpypi]
coverage = true

[tool.crewplane.validation.profiles.windows]

[tool.crewplane.validation.profiles.nightly]

[tool.crewplane.validation.profiles.nightly-shuffle]
random_shuffle = true

[tool.crewplane.validation.profiles.race]
marker_expression = "race"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ARG", "T10"]
ignore = ["E501", "B008"]
dummy-variable-rgx = "^$"

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--import-mode=importlib",
    "--disable-plugin-autoload",
]
strict_config = true
strict_markers = true
markers = [
    "race: deterministic regression for a controlled concurrency or cancellation interleaving",
]
strict_parametrization_ids = true
collect_imported_tests = false
empty_parameter_set_mark = "fail_at_collect"
tmp_path_retention_policy = "failed"
filterwarnings = ["error"]

[tool.coverage.run]
patch = ["subprocess"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
show_error_codes = true

[project]
name = "crewplane"
version = "0.1.7"
description = "A provider-neutral CLI-first control plane for human-designed coding-agent workflows"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "typer>=0.12.0",
    "click>=8.0.0",
    "shellingham>=1.3.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "markdown-it-py>=4.0",
    "rich>=13.0",
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "build>=1.3",
    "mypy>=1.18",
    "packaging>=24.0",
    "pytest>=9.1",
    "pytest-cov>=7.0",
    "ruff>=0.6",
    "twine>=6.0",
]
stress = [
    "pytest-randomly>=4.0.1",
]

[project.scripts]
crewplane = "crewplane.cli.app:app"

[project.urls]
Homepage = "https://github.com/crewplaneai/crewplane"
Repository = "https://github.com/crewplaneai/crewplane"
Issues = "https://github.com/crewplaneai/crewplane/issues"
Documentation = "https://github.com/crewplaneai/crewplane/blob/master/docs/index.md"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewplane"]
include = [
    "src/crewplane/py.typed",
    "src/crewplane/example_templates/*.yml",
    "src/crewplane/example_templates/*.yaml",
    "src/crewplane/example_templates/*.md",
    "src/crewplane/example_templates/**/*.yml",
    "src/crewplane/example_templates/**/*.yaml",
    "src/crewplane/example_templates/**/*.md",
]

[tool.hatch.build.targets.sdist]
only-include = [
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "src/crewplane",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ARG", "T10"]
ignore = ["E501", "B008"]
dummy-variable-rgx = "^$"

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--import-mode=importlib",
    "--disable-plugin-autoload",
]
strict_config = true
strict_markers = true
strict_parametrization_ids = true
collect_imported_tests = false
empty_parameter_set_mark = "fail_at_collect"
tmp_path_retention_policy = "failed"
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
show_error_codes = true

[project]
name = "crewplane-ollama"
version = "0.1.0"
description = "Explicit local Ollama CLI capability for Crewplane"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = ["crewplane>=0.3.8"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewplane_ollama"]

[project]
name = "crewplane-ollama"
version = "0.2.0"
description = "Explicit tool-enabled Ollama agent capability for Crewplane"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = ["crewplane>=0.3.8", "httpx>=0.28.1,<1"]

[project.scripts]
ollama-agent = "crewplane_ollama.agent_cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewplane_ollama"]

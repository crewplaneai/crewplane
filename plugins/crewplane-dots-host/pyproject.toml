[project]
name = "crewplane-dots-host"
version = "0.1.0"
description = "OpenAI Dots active-host transport for Crewplane workflows"
requires-python = ">=3.13"
dependencies = ["crewplane>=0.3.8"]
[project.scripts]
crewplane-dots-host = "crewplane_dots_host:main"
[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/crewplane_dots_host"]

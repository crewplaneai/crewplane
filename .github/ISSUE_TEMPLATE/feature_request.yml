name: Feature request
description: Propose a focused improvement.
title: "feat: "
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful solution.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI UX
        - Workflow authoring and composition
        - Config and provider integrations
        - Runtime execution
        - Artifacts, resume, and support bundles
        - Observability and tmux UI
        - Docs
        - Packaging / installation
        - Security
        - Other

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to submit a PR.
        - label: This may require an ADR.
        - label: This may be a breaking change.

name: Question
description: Ask a usage question. Prefer Discussions for open-ended help.
title: "[Question]: "
labels: ["type: question", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended usage discussion, please use GitHub Discussions if enabled.
        Use this form when you think the question may reveal a docs gap or bug.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include commands, config snippets, and relevant output.
      render: shell
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version or commit SHA.
      placeholder: "crewplane 0.1.1 or commit SHA"
    validations:
      required: false

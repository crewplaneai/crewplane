name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag just created by make release from the current master commit"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-release-publication
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_commit: ${{ steps.release-source.outputs.release_commit }}
    env:
      TAG_NAME: ${{ inputs.tag }}
    steps:
      - name: Reject non-master dispatch
        if: github.ref != 'refs/heads/master'
        run: |
          echo "GitHub Release publication must be dispatched from master." >&2
          exit 1

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and verify current release source
        id: release-source
        run: |
          release_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          if [ "$release_commit" != "$GITHUB_SHA" ]; then
            echo "Release tag must point to the dispatched master commit." >&2
            exit 1
          fi
          echo "release_commit=$release_commit" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.9"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Prepare release artifacts
        run: |
          uv run --locked --extra dev \
            python scripts/release.py release-artifacts

      - name: Verify GitHub release inputs
        run: |
          uv run --locked --extra dev \
            python scripts/release.py github-release-plan \
            --expected-tag "$TAG_NAME"

      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: |
            dist/*
            .release/npm/*.tgz
            .release/release-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  github-release:
    name: github-release
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ inputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit remains on master
        run: |
          git fetch --quiet --no-tags origin refs/heads/master
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.9"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-bundle
          path: .

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish_github_release.sh dist

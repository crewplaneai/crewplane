name: testpypi

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you publishing a TestPyPI build?"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: testpypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish-testpypi:
    name: build-and-publish-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/project/crewplane/
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run fast tests
        run: make test

      - name: Build package
        run: uv build

      - name: Verify wheel metadata
        run: uvx twine check dist/*

      - name: Publish to TestPyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

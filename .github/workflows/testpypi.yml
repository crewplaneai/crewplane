name: testpypi

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you publishing a TestPyPI build?"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: testpypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  policy:
    uses: ./.github/workflows/validation-policy.yml

  build:
    name: build
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.policy.outputs.policy).job_minutes.testpypi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: "packaging/uv-bootstrap-version.txt"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run full suite with coverage
        run: uv run --locked --extra dev python scripts/run_tests.py --profile testpypi

      - name: Build and validate package
        run: uv run --locked --extra dev python scripts/run_package_checks.py --profile testpypi

      - name: Upload dist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testpypi-acceptance
          path: test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  publish-testpypi:
    name: publish-testpypi
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/crewplane/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist

      - name: Publish to TestPyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

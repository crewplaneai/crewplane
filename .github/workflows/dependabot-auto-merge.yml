name: dependabot-auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependabot-auto-merge:
    name: dependabot-auto-merge
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for low-risk updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_TYPE: ${{ steps.metadata.outputs.dependency-type }}
        run: |
          set -euo pipefail
          echo "update-type=$UPDATE_TYPE dependency-type=$DEPENDENCY_TYPE"

          case "$UPDATE_TYPE" in
            version-update:semver-patch)
              gh pr merge --auto --squash "$PR_URL"
              ;;
            version-update:semver-minor)
              if [ "$DEPENDENCY_TYPE" = "direct:development" ] || [ "$DEPENDENCY_TYPE" = "indirect" ]; then
                gh pr merge --auto --squash "$PR_URL"
              else
                echo "Skipping minor production dependency update."
              fi
              ;;
            *)
              echo "Skipping non-patch/minor update."
              ;;
          esac

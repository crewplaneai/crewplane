name: dependency-review

on:
  pull_request:
    branches: ["master"]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "packaging/npm/package*.json"
      - ".github/workflows/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
          allow-licenses: >
            0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, CC0-1.0,
            ISC, MIT, MPL-2.0, PSF-2.0, Python-2.0,
            Unicode-3.0, Unicode-DFS-2016, Unlicense, Zlib
          # 4.16.0 declares PSF-2.0; dependency review misidentifies it as GPL:
          # https://pypi.org/project/typing-extensions/4.16.0/
          # The action ignores PURL versions, so the regression test guards the
          # locked version and requires this exception to be reviewed on upgrade.
          allow-dependencies-licenses: pkg:pypi/typing-extensions
          comment-summary-in-pr: always

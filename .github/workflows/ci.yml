name: ci

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.9"
          enable-cache: true
          prune-cache: true

      - name: Install dependencies
        run: uv sync --locked --python 3.13 --extra dev

      - name: Check repository hygiene
        run: uvx pre-commit==4.6.0 run --all-files --show-diff-on-failure

      - name: Check GitHub Actions workflows
        run: make actionlint

      - name: Check formatting
        run: make format-check

      - name: Lint
        run: make lint

      - name: Check typed extension contracts
        run: make typecheck

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.9"
          enable-cache: true
          prune-cache: true

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev

      - name: Run tests
        run: uv run --locked --python ${{ matrix.python-version }} --extra dev make test

      - name: CLI smoke test
        run: uv run --locked --python ${{ matrix.python-version }} --extra dev crewplane --help

  git-floor:
    name: git floor (2.34.1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Git build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential zlib1g-dev

      - name: Build verified Git 2.34.1
        env:
          GIT_ARCHIVE_SHA256: 3a0755dd1cfab71a24dd96df3498c29cd0acd13b04f3d08bf933e81286db802c
          GIT_VERSION: 2.34.1
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/git-$GIT_VERSION.tar.xz"
          source_dir="$RUNNER_TEMP/git-$GIT_VERSION"
          prefix="$RUNNER_TEMP/git-floor-$GIT_VERSION"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://mirrors.edge.kernel.org/pub/software/scm/git/git-$GIT_VERSION.tar.xz"
          printf '%s  %s\n' "$GIT_ARCHIVE_SHA256" "$archive" | sha256sum --check -
          tar -xf "$archive" -C "$RUNNER_TEMP"
          make -C "$source_dir" -j2 \
            prefix="$prefix" \
            NO_CURL=YesPlease \
            NO_EXPAT=YesPlease \
            NO_GETTEXT=YesPlease \
            NO_OPENSSL=YesPlease \
            NO_TCLTK=YesPlease \
            all
          make -C "$source_dir" \
            prefix="$prefix" \
            NO_CURL=YesPlease \
            NO_EXPAT=YesPlease \
            NO_GETTEXT=YesPlease \
            NO_OPENSSL=YesPlease \
            NO_TCLTK=YesPlease \
            install
          printf '%s\n' "$prefix/bin" >> "$GITHUB_PATH"
          printf 'GIT_FLOOR_BIN=%s\n' "$prefix/bin" >> "$GITHUB_ENV"

      - name: Verify floor executable
        run: |
          set -euo pipefail
          printf 'Git executable: %s\n' "$(command -v git)"
          git --version
          test "$(command -v git)" = "$GIT_FLOOR_BIN/git"
          test "$(git --version)" = "git version 2.34.1"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.9"
          enable-cache: true
          prune-cache: true

      - name: Install dependencies
        run: uv sync --locked --python 3.13 --extra dev

      - name: Report floor environment
        run: |
          set -euo pipefail
          uname -a
          locale
          date +%Z
          uv --version
          uv run --locked --python 3.13 --extra dev python --version
          uv run --locked --python 3.13 --extra dev python -m pytest --version
          printf 'Git executable: %s\n' "$(command -v git)"
          git --version
          test "$(command -v git)" = "$GIT_FLOOR_BIN/git"
          test "$(git --version)" = "git version 2.34.1"

      - name: Run exact Git floor tests
        env:
          CREWPLANE_REQUIRED_GIT: "1"
          GIT_REPORT: ${{ runner.temp }}/crewplane-git-floor.xml
        run: |
          uv run --locked --python 3.13 --extra dev python -m pytest -q -ra \
            --junitxml="$GIT_REPORT" \
            tests/unit/cli/test_workspace_source_policy_git.py \
            tests/integration/cli/test_workspace_workflow_runner.py

      - name: Enforce zero skips
        env:
          GIT_REPORT: ${{ runner.temp }}/crewplane-git-floor.xml
        run: |
          uv run --locked --python 3.13 --extra dev python - "$GIT_REPORT" <<'PY'
          import sys
          from xml.etree import ElementTree

          root = ElementTree.parse(sys.argv[1]).getroot()
          skipped = sum(
              int(suite.attrib.get("skipped", "0"))
              for suite in root.iter("testsuite")
          )
          if skipped:
              raise SystemExit(f"Git floor lane skipped {skipped} tests")
          PY

      - name: Upload Git floor test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: git-floor-junit
          path: ${{ runner.temp }}/crewplane-git-floor.xml
          if-no-files-found: error
          retention-days: 7

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [git-floor, lint, test]
    if: ${{ always() }}
    steps:
      - name: Verify required prerequisite jobs
        run: |
          test '${{ needs.git-floor.result }}' = 'success'
          test '${{ needs.lint.result }}' = 'success'
          test '${{ needs.test.result }}' = 'success'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.9"
          enable-cache: true
          prune-cache: true

      - name: Build and smoke-test package
        run: make install-smoke-pip

      - name: Type-check installed wheel consumer
        run: make wheel-typecheck

      - name: Inspect dist
        run: |
          ls -la dist
          python -m zipfile --test dist/*.whl
          uv run --extra dev twine check dist/*

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

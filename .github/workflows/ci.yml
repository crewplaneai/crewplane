name: ci

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    uses: ./.github/workflows/validation-policy.yml

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: "packaging/uv-bootstrap-version.txt"
          enable-cache: true
          prune-cache: true

      - name: Install dependencies
        run: uv sync --locked --python 3.13 --extra dev

      - name: Check repository hygiene
        run: uvx pre-commit==4.6.0 run --all-files --show-diff-on-failure

      - name: Check GitHub Actions workflows
        run: make actionlint

      - name: Check formatting
        run: make format-check

      - name: Lint
        run: make lint

      - name: Check strict typing
        run: make typecheck

  test:
    name: test (${{ matrix.python-version }})
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.policy.outputs.policy).job_minutes.linux }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: "packaging/uv-bootstrap-version.txt"
          enable-cache: true
          prune-cache: true

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev --extra stress

      - name: Run tests
        run: uv run --locked --python ${{ matrix.python-version }} --extra dev --extra stress python scripts/run_tests.py --profile ${{ matrix.python-version == '3.13' && 'pr-313' || 'pr-314' }} --suite all

      - name: CLI smoke test
        run: uv run --locked --python ${{ matrix.python-version }} --extra dev crewplane --help

      - name: Fuzz YAML parser
        id: fuzz_yaml
        if: ${{ matrix.python-version == '3.13' }}
        timeout-minutes: ${{ fromJSON(needs.policy.outputs.policy).job_minutes.fuzz }}
        run: |
          mkdir -p "$RUNNER_TEMP/fuzz-yaml"
          uv run --locked --python 3.13 --extra dev \
            --with atheris==3.1.0 \
            python fuzz/fuzz_yaml.py \
            -max_total_time=${{ fromJSON(needs.policy.outputs.policy).fuzz.total_seconds }} \
            -timeout=${{ fromJSON(needs.policy.outputs.policy).fuzz.input_seconds }} \
            -max_len=${{ fromJSON(needs.policy.outputs.policy).fuzz.max_length }} \
            -rss_limit_mb=${{ fromJSON(needs.policy.outputs.policy).fuzz.rss_limit_mb }} \
            -artifact_prefix="$RUNNER_TEMP/fuzz-yaml/"

      - name: Upload fuzz failure artifacts
        if: ${{ failure() && steps.fuzz_yaml.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-yaml-failure
          path: ${{ runner.temp }}/fuzz-yaml/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-tests-${{ matrix.python-version }}
          path: test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: windows (${{ matrix.python-version }})
    needs: policy
    runs-on: windows-latest
    timeout-minutes: ${{ fromJSON(needs.policy.outputs.policy).job_minutes.win32 }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: "packaging/uv-bootstrap-version.txt"
          enable-cache: true
          prune-cache: true

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev

      - name: Run native Windows suite
        run: uv run --locked --python ${{ matrix.python-version }} --extra dev python scripts/run_tests.py --profile windows

      - name: Build and smoke-test installed Windows wheels
        run: uv run --locked --python ${{ matrix.python-version }} --extra dev python scripts/run_package_checks.py --profile windows

      - name: Upload test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-tests-${{ matrix.python-version }}
          path: test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.policy.outputs.policy).job_minutes.package }}
    needs: [policy, lint, test, windows]
    if: ${{ always() }}
    steps:
      - name: Verify required prerequisite jobs
        run: |
          test '${{ needs.lint.result }}' = 'success'
          test '${{ needs.test.result }}' = 'success'
          test '${{ needs.windows.result }}' = 'success'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: "packaging/uv-bootstrap-version.txt"
          enable-cache: true
          prune-cache: true

      - name: Build and validate package
        run: uv run --locked --extra dev python scripts/run_package_checks.py --profile ci

      - name: Upload dist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-acceptance
          path: test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

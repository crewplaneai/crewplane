name: validation-policy

on:
  workflow_call:
    outputs:
      policy:
        description: Validated defaults and derived CI budgets from pyproject.toml
        value: ${{ jobs.load.outputs.policy }}

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    # This bootstrap job must have a limit before the repository policy is read.
    timeout-minutes: 5
    outputs:
      policy: ${{ steps.policy.outputs.policy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - id: policy
        run: python scripts/validation_policy.py --github-output "$GITHUB_OUTPUT"

name: repo-hygiene

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check for stale automation placeholders
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          pattern = re.compile(
              r"YOUR_ORG|YOUR_REPO|YOUR_GITHUB_USERNAME|security@example\.com|"
              r"src/orchestrator_cli|orchestrator-cli|Orchestrator CLI|"
              r"\.orchestrator|Python 3\.1[0-2]|python-version: \"3\.12\"|"
              r"test \(3\.12\)"
          )
          targets = [
              ".github",
              ".editorconfig",
              ".gitattributes",
              ".pre-commit-config.yaml",
              "CODE_OF_CONDUCT.md",
              "GOVERNANCE.md",
              "MAINTAINERS.md",
              "MANIFEST.md",
              "NOTICE",
              "SUPPORT.md",
              "mkdocs.yml",
              "pyproject.gitops-fragment.toml",
              "renovate.json5",
          ]
          excluded = Path(".github/workflows/repo-hygiene.yml")
          found = False
          for target in targets:
              path = Path(target)
              if not path.exists():
                  raise SystemExit(f"missing expected hygiene target: {target}")
              files = path.rglob("*") if path.is_dir() else (path,)
              for file_path in files:
                  if (
                      file_path == excluded
                      or file_path.is_symlink()
                      or not file_path.is_file()
                  ):
                      continue
                  text = file_path.read_text(encoding="utf-8", errors="ignore")
                  for line_number, line in enumerate(text.splitlines(), start=1):
                      if pattern.search(line):
                          print(f"{file_path}:{line_number}:{line}")
                          found = True
          if found:
              raise SystemExit(1)
          PY

      - name: Check expected automation files
        run: |
          set -euo pipefail
          test -f .github/labels.json
          test -f .github/labeler.yml
          test -f .github/dependabot.yml
          test -f .github/release-drafter.yml
          test -f .github/workflows/ci.yml
          test -f .github/workflows/release.yml

      - name: Check dependency-review trigger coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/dependency-review.yml").read_text(
              encoding="utf-8"
          )
          if "paths:" in workflow and ".github/workflows/" not in workflow:
              raise SystemExit(
                  "dependency-review.yml narrows pull_request paths without covering "
                  ".github/workflows/ dependency manifests."
              )
          PY

      - name: Check package metadata
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          assert project["name"] == "crewplane"
          assert project["requires-python"] == ">=3.13"
          assert project["scripts"] == {"crewplane": "crewplane.cli.app:app"}
          PY

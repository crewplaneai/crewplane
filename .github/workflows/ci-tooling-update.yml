name: uv bootstrap update

on:
  schedule:
    - cron: "30 20 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uv-bootstrap-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uv-bootstrap-update:
    name: update pinned uv metadata
    if: github.repository == 'crewplaneai/crewplane' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      pull-requests: read
    env:
      CREWPLANE_UV_BOOTSTRAP_ROOT: ${{ github.workspace }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Preserve the trusted updater
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scripts"
          cp scripts/update_uv_bootstrap.py \
            "$RUNNER_TEMP/scripts/update_uv_bootstrap.py"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Dependabot deliberately owns PR creation. The uv-bootstrap workflow
      # intentionally does not create its own automation/uv-bootstrap PR because
      # that would require a GitHub token allowed to create pull requests.
      - name: Select the Dependabot uv PR
        id: lane
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          matching_head_refs=()
          pull_request_candidates="$RUNNER_TEMP/dependabot-prs.tsv"
          gh pr list --state open --base master --app dependabot --limit 100 \
            --json number,headRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository == false) | select(.headRefName | startswith("dependabot/")) | [.number, .headRefName] | @tsv' \
            > "$pull_request_candidates"
          while IFS=$'\t' read -r pr_number head_ref; do
            changes_uv_pin="$(
              gh pr view "$pr_number" --json files \
                --jq 'any(.files[]; .path == "packaging/uv-bootstrap-version.txt")'
            )"
            if [ "$changes_uv_pin" = true ]; then
              matching_head_refs+=("$head_ref")
            fi
          done < "$pull_request_candidates"

          case "${#matching_head_refs[@]}" in
            0)
              printf 'No open same-repository Dependabot PR changes packaging/uv-bootstrap-version.txt; waiting for the next weekly update.\n'
              printf 'active=false\n' >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            1)
              head_ref="${matching_head_refs[0]}"
              ;;
            *)
              printf 'Expected at most one Dependabot PR changing packaging/uv-bootstrap-version.txt; found %s.\n' "${#matching_head_refs[@]}" >&2
              exit 1
              ;;
          esac

          case "$head_ref" in
            dependabot/*) ;;
            *) printf 'Unexpected Dependabot head: %s\n' "$head_ref" >&2; exit 1 ;;
          esac
          git fetch --no-tags origin master "$head_ref"
          git checkout -B "$head_ref" "origin/$head_ref"
          git rebase origin/master

          {
            printf 'active=true\n'
            printf 'head_ref=%s\n' "$head_ref"
          } >> "$GITHUB_OUTPUT"

      - name: Update and validate pinned uv metadata
        if: steps.lane.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          requested_pin="$(< packaging/uv-bootstrap-version.txt)"
          if [[ ! "$requested_pin" =~ ^uv==([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            printf 'Invalid uv version pin: %s\n' "$requested_pin" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          (
            cd "$RUNNER_TEMP"
            python scripts/update_uv_bootstrap.py update "$version"
            python scripts/update_uv_bootstrap.py check
          )
          sh -n install.sh
          node --check packaging/npm/scripts/postinstall.js

          if ! git diff --quiet; then
            git add \
              install.sh \
              packaging/npm/scripts/postinstall.js \
              packaging/uv-bootstrap.json \
              packaging/uv-bootstrap-version.txt
            git commit -m "build(deps): update uv bootstrap to $version [dependabot skip]"
          fi

      - name: Publish the Dependabot branch
        id: publish
        if: steps.lane.outputs.active == 'true'
        shell: bash
        env:
          HEAD_REF: ${{ steps.lane.outputs.head_ref }}
        run: |
          set -euo pipefail
          published=false
          if ! git diff --quiet "origin/$HEAD_REF" HEAD; then
            git push --force-with-lease origin "HEAD:$HEAD_REF"
            published=true
          fi
          printf 'published=%s\n' "$published" >> "$GITHUB_OUTPUT"

      - name: Dispatch CI for the bot-authored push
        if: steps.publish.outputs.published == 'true'
        shell: bash
        env:
          HEAD_REF: ${{ steps.lane.outputs.head_ref }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --ref "$HEAD_REF"

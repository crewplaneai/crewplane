name: ci-tooling update

on:
  schedule:
    - cron: "30 20 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-tooling-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-tooling-update:
    name: update pinned uv metadata
    if: github.repository == 'crewplaneai/crewplane' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      CREWPLANE_UV_BOOTSTRAP_ROOT: ${{ github.workspace }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Preserve the trusted updater
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scripts"
          cp scripts/update_uv_bootstrap.py \
            "$RUNNER_TEMP/scripts/update_uv_bootstrap.py"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Select the ci-tooling PR lane
        id: lane
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dependabot_pr="$(
              gh pr list --state open --base master --app dependabot \
                --json number,headRefName \
                --jq '[.[] | select(.headRefName | startswith("dependabot/")) | select(.headRefName | contains("ci-tooling"))][0].number // empty'
          )"
          if [ -z "$dependabot_pr" ]; then
            printf 'No open Dependabot ci-tooling PR; waiting for the next weekly update.\n'
            printf 'active=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          head_ref="$(
            gh pr view "$dependabot_pr" --json headRefName \
              --jq '.headRefName'
          )"
          case "$head_ref" in
            dependabot/*ci-tooling*) ;;
            *) printf 'Unexpected Dependabot head: %s\n' "$head_ref" >&2; exit 1 ;;
          esac
          git fetch --no-tags origin master "$head_ref"
          git checkout -B "$head_ref" "origin/$head_ref"
          git rebase origin/master

          {
            printf 'active=true\n'
            printf 'head_ref=%s\n' "$head_ref"
            printf 'pr_number=%s\n' "$dependabot_pr"
          } >> "$GITHUB_OUTPUT"

      - name: Update and validate pinned uv metadata
        id: update
        if: steps.lane.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="$(
            cd "$RUNNER_TEMP"
            python scripts/update_uv_bootstrap.py update latest
          )"
          (
            cd "$RUNNER_TEMP"
            python scripts/update_uv_bootstrap.py check
          )
          sh -n install.sh
          node --check packaging/npm/scripts/postinstall.js

          if git diff --quiet; then
            changed=false
          else
            changed=true
            git add \
              install.sh \
              packaging/npm/scripts/postinstall.js \
              packaging/uv-bootstrap.json \
              packaging/uv-bootstrap-version.txt
            git commit -m "build(deps): update uv bootstrap to $version [dependabot skip]"
          fi

          {
            printf 'changed=%s\n' "$changed"
            printf 'version=%s\n' "$version"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the ci-tooling branch
        id: publish
        if: steps.lane.outputs.active == 'true'
        shell: bash
        env:
          HEAD_REF: ${{ steps.lane.outputs.head_ref }}
        run: |
          set -euo pipefail
          published=false
          if ! git diff --quiet "origin/$HEAD_REF" HEAD; then
            git push --force-with-lease origin "HEAD:$HEAD_REF"
            published=true
          fi
          printf 'published=%s\n' "$published" >> "$GITHUB_OUTPUT"

      - name: Label the updated ci-tooling PR
        if: steps.update.outputs.changed == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.lane.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh pr edit "$PR_NUMBER" \
            --add-label "dependencies" \
            --add-label "area: ci" \
            --add-label "area: packaging"
          printf 'Updated Dependabot ci-tooling PR #%s.\n' "$PR_NUMBER"

      - name: Dispatch CI for the bot-authored push
        if: steps.publish.outputs.published == 'true'
        shell: bash
        env:
          HEAD_REF: ${{ steps.lane.outputs.head_ref }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --ref "$HEAD_REF"

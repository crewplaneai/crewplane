name: nightly

on:
  schedule:
    - cron: "11 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-platform:
    name: ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          enable-cache: true
          prune-cache: true

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev

      - name: Run tests
        run: uv run --locked --python ${{ matrix.python-version }} --extra dev python -m pytest -q

      - name: CLI smoke test
        run: uv run --locked --python ${{ matrix.python-version }} --extra dev crewplane --help

  shuffled-suite:
    name: shuffled suite (ubuntu py3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CREWPLANE_RANDOM_SEED: ${{ github.run_id }}
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          enable-cache: true
          prune-cache: true

      - name: Install test and stress dependencies
        run: uv sync --locked --python 3.13 --extra dev --extra stress

      - name: Print reliability canary diagnostics
        shell: bash
        run: |
          set -eu
          printf 'OS: %s\n' '${{ runner.os }}'
          printf 'Architecture: %s\n' "$(uname -m)"
          uv run --locked --python 3.13 --extra dev --extra stress python --version
          uv run --locked --python 3.13 --extra dev --extra stress \
            python -m pytest --version
          uv --version
          git --version
          locale
          printf 'Timezone: %s\n' "$(date +%Z)"
          printf 'pytest-randomly seed: %s\n' "$CREWPLANE_RANDOM_SEED"
          printf 'Selection: full test suite\n'
          printf 'Iteration count: 1\n'
          printf 'Skip summary: reported by pytest -ra\n'

      - name: Run shuffled test suite
        shell: bash
        run: |
          set -eu
          seed="${CREWPLANE_RANDOM_SEED:?set CREWPLANE_RANDOM_SEED}"
          printf 'Reproduce locally:\n'
          printf 'CREWPLANE_RANDOM_SEED=%s uv run --locked --python 3.13 --extra dev --extra stress python -m pytest -p randomly --randomly-seed=%s -q -ra\n' \
            "$seed" "$seed"
          uv run --locked --python 3.13 --extra dev --extra stress \
            python -m pytest -p randomly \
            --randomly-seed="$seed" \
            -q -ra

  focused-race-loop:
    name: focused race loop (ubuntu py3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FOCUSED_RACE_ITERATIONS: "5"
      FOCUSED_RACE_SELECTION: "tests/integration/runtime/execution/workflow/test_sequential_stage_basics.py::ExecutorSequentialStageBasicsTests::test_multi_provider_reviewers_run_in_parallel_within_local_round"
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          enable-cache: true
          prune-cache: true

      - name: Install test dependencies
        run: uv sync --locked --python 3.13 --extra dev

      - name: Print focused race diagnostics
        shell: bash
        run: |
          set -eu
          printf 'OS: %s\n' '${{ runner.os }}'
          printf 'Architecture: %s\n' "$(uname -m)"
          uv run --locked --python 3.13 --extra dev python --version
          uv run --locked --python 3.13 --extra dev python -m pytest --version
          uv --version
          git --version
          locale
          printf 'Timezone: %s\n' "$(date +%Z)"
          printf 'Selection: %s\n' "$FOCUSED_RACE_SELECTION"
          printf 'Iteration count: %s fresh pytest processes\n' \
            "$FOCUSED_RACE_ITERATIONS"
          printf 'Skip summary: reported by pytest -ra for each iteration\n'
          printf 'Reproduce locally:\n'
          # Variables must remain literal in the copyable bash -c command.
          # shellcheck disable=SC2016
          printf 'FOCUSED_RACE_SELECTION=%q FOCUSED_RACE_ITERATIONS=%q bash -c '\''iteration=1; while [ "$iteration" -le "$FOCUSED_RACE_ITERATIONS" ]; do uv run --locked --python 3.13 --extra dev python -m pytest -q -ra "$FOCUSED_RACE_SELECTION"; iteration=$((iteration + 1)); done'\''\n' \
            "$FOCUSED_RACE_SELECTION" "$FOCUSED_RACE_ITERATIONS"

      - name: Run focused race regression in fresh processes
        shell: bash
        run: |
          set -eu
          iteration=1
          while [ "$iteration" -le "$FOCUSED_RACE_ITERATIONS" ]; do
            printf 'Starting iteration %s of %s\n' \
              "$iteration" "$FOCUSED_RACE_ITERATIONS"
            uv run --locked --python 3.13 --extra dev \
              python -m pytest -q -ra "$FOCUSED_RACE_SELECTION"
            iteration=$((iteration + 1))
          done

  ci-tooling-update:
    name: update pinned uv metadata
    if: github.repository == 'crewplaneai/crewplane' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      CI_TOOLING_BRANCH: automation/ci-tooling
      CREWPLANE_UV_BOOTSTRAP_ROOT: ${{ github.workspace }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Preserve the trusted updater
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scripts"
          cp scripts/update_uv_bootstrap.py \
            "$RUNNER_TEMP/scripts/update_uv_bootstrap.py"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Select the ci-tooling PR lane
        id: lane
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dependabot_pr="$(
              gh pr list --state open --base master --app dependabot \
                --json number,headRefName \
                --jq '[.[] | select(.headRefName | startswith("dependabot/")) | select(.headRefName | contains("ci-tooling"))][0].number // empty'
          )"
          automation_pr="$(
              gh pr list --state open --base master \
                --head "$CI_TOOLING_BRANCH" \
                --json number,isCrossRepository \
                --jq '[.[] | select(.isCrossRepository == false)][0].number // empty'
          )"

          if [ -n "$dependabot_pr" ]; then
            head_ref="$(
              gh pr view "$dependabot_pr" --json headRefName \
                --jq '.headRefName'
            )"
            case "$head_ref" in
              dependabot/*ci-tooling*) ;;
              *) printf 'Unexpected Dependabot head: %s\n' "$head_ref" >&2; exit 1 ;;
            esac
            mode=dependabot
            pr_number="$dependabot_pr"
            git fetch --no-tags origin master "$head_ref"
            git checkout -B "$head_ref" "origin/$head_ref"
            git rebase origin/master
          else
            head_ref="$CI_TOOLING_BRANCH"
            mode=automation
            pr_number="$automation_pr"
            git fetch --no-tags origin master
            git checkout -B "$head_ref" origin/master
          fi

          printf 'head_ref=%s\n' "$head_ref" >> "$GITHUB_OUTPUT"
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
          printf 'pr_number=%s\n' "$pr_number" >> "$GITHUB_OUTPUT"
          printf 'automation_pr=%s\n' "$automation_pr" >> "$GITHUB_OUTPUT"

      - name: Update and validate pinned uv metadata
        id: update
        shell: bash
        run: |
          set -euo pipefail
          version="$(
            cd "$RUNNER_TEMP"
            python scripts/update_uv_bootstrap.py update latest
          )"
          (
            cd "$RUNNER_TEMP"
            python scripts/update_uv_bootstrap.py check
          )
          sh -n install.sh
          node --check packaging/npm/scripts/postinstall.js

          if git diff --quiet; then
            changed=false
          else
            changed=true
            git add \
              .github/workflows \
              install.sh \
              packaging/npm/scripts/postinstall.js \
              packaging/uv-bootstrap.json
            git commit -m "build(deps): update uv bootstrap to $version [dependabot skip]"
          fi

          printf 'changed=%s\n' "$changed" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Publish the ci-tooling branch
        id: publish
        shell: bash
        env:
          CHANGED: ${{ steps.update.outputs.changed }}
          HEAD_REF: ${{ steps.lane.outputs.head_ref }}
          MODE: ${{ steps.lane.outputs.mode }}
        run: |
          set -euo pipefail
          published=false
          if [ "$MODE" = automation ] && [ "$CHANGED" = false ]; then
            printf 'The automation lane has no uv update to publish.\n'
          elif ! git diff --quiet "origin/$HEAD_REF" HEAD 2>/dev/null; then
            if git show-ref --verify --quiet "refs/remotes/origin/$HEAD_REF"; then
              git push --force-with-lease origin "HEAD:$HEAD_REF"
            else
              git push --set-upstream origin "HEAD:$HEAD_REF"
            fi
            published=true
          fi
          printf 'published=%s\n' "$published" >> "$GITHUB_OUTPUT"

      - name: Create or update the ci-tooling PR
        if: steps.update.outputs.changed == 'true' || steps.lane.outputs.mode == 'dependabot'
        shell: bash
        env:
          HEAD_REF: ${{ steps.lane.outputs.head_ref }}
          MODE: ${{ steps.lane.outputs.mode }}
          PR_NUMBER: ${{ steps.lane.outputs.pr_number }}
          UV_VERSION: ${{ steps.update.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$PR_NUMBER" ]; then
            gh pr create \
              --base master \
              --head "$HEAD_REF" \
              --title "build(deps): update ci-tooling" \
              --body "Daily repository automation updated the pinned, checksum-verified uv bootstrap metadata to $UV_VERSION. This PR uses the same ci-tooling lane as grouped GitHub Actions and pre-commit updates." \
              --label "dependencies" \
              --label "status: needs-triage" \
              --label "area: ci" \
              --label "area: packaging"
            PR_NUMBER="$(
              gh pr list --state open --base master --head "$HEAD_REF" \
                --json number,isCrossRepository \
                --jq '[.[] | select(.isCrossRepository == false)][0].number'
            )"
          else
            gh pr edit "$PR_NUMBER" \
              --add-label "dependencies" \
              --add-label "area: ci" \
              --add-label "area: packaging"
          fi
          printf 'Using ci-tooling PR #%s (%s).\n' "$PR_NUMBER" "$MODE"

      - name: Close a superseded automation PR
        if: steps.lane.outputs.mode == 'dependabot' && steps.lane.outputs.automation_pr != ''
        shell: bash
        env:
          AUTOMATION_PR: ${{ steps.lane.outputs.automation_pr }}
          DEPENDABOT_PR: ${{ steps.lane.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh pr close "$AUTOMATION_PR" \
            --comment "Superseded by the active Dependabot ci-tooling PR #$DEPENDABOT_PR. The uv metadata update was moved there."

      - name: Close an empty automation PR
        if: steps.lane.outputs.mode == 'automation' && steps.update.outputs.changed == 'false' && steps.lane.outputs.pr_number != ''
        shell: bash
        env:
          PR_NUMBER: ${{ steps.lane.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh pr close "$PR_NUMBER" \
            --comment "The pinned uv metadata is now current on master, so this automation PR no longer contains an update."

      - name: Dispatch CI for the bot-authored push
        if: steps.publish.outputs.published == 'true'
        shell: bash
        env:
          HEAD_REF: ${{ steps.lane.outputs.head_ref }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --ref "$HEAD_REF"

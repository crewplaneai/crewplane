name: nightly

on:
  schedule:
    - cron: "11 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-platform:
    name: ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: "packaging/uv-bootstrap-version.txt"
          enable-cache: true
          prune-cache: true

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev

      - name: Run tests
        run: uv run --locked --python ${{ matrix.python-version }} --extra dev python scripts/run_tests.py --profile nightly

      - name: Run Dots host plugin tests
        if: ${{ runner.os != 'Windows' }}
        run: make dots-host-check

      - name: CLI smoke test
        run: uv run --locked --python ${{ matrix.python-version }} --extra dev crewplane --help

      - name: Build Windows wheel
        if: ${{ runner.os == 'Windows' }}
        run: uv run --locked --extra dev python scripts/release.py package-build

      - name: Smoke-test installed Windows wheels
        shell: pwsh
        if: ${{ runner.os == 'Windows' }}
        run: |
          uv run --locked --python ${{ matrix.python-version }} --extra dev python tests/helpers/installed_wheel_smoke.py --installer pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked --python ${{ matrix.python-version }} --extra dev python tests/helpers/installed_wheel_smoke.py --installer uv

      - name: Upload test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-${{ runner.os }}-${{ matrix.python-version }}
          path: test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  shuffled-suite:
    name: shuffled suite (ubuntu py3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CREWPLANE_RANDOM_SEED: ${{ github.run_id }}
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: "packaging/uv-bootstrap-version.txt"
          enable-cache: true
          prune-cache: true

      - name: Install test and stress dependencies
        run: uv sync --locked --python 3.13 --extra dev --extra stress

      - name: Run shuffled test suite
        run: uv run --locked --python 3.13 --extra dev --extra stress python scripts/run_tests.py --profile nightly-shuffle

      - name: Upload test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-shuffle
          path: test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  focused-race-loop:
    name: focused race loop (${{ matrix.os }} py3.13)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      FOCUSED_RACE_ITERATIONS: "5"
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: "packaging/uv-bootstrap-version.txt"
          enable-cache: true
          prune-cache: true

      - name: Install test dependencies
        run: uv sync --locked --python 3.13 --extra dev

      - name: Run focused race regression in fresh processes
        shell: bash
        run: |
          set -eu
          iteration=1
          while [ "$iteration" -le "$FOCUSED_RACE_ITERATIONS" ]; do
            uv run --locked --python 3.13 --extra dev \
              python scripts/run_tests.py --profile race
            iteration=$((iteration + 1))
          done

      - name: Upload test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-race-${{ runner.os }}
          path: test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

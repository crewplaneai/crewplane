name: zizmor

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/**"
  schedule:
    - cron: "42 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true

      - name: Audit workflows
        run: uvx zizmor --persona=regular --no-exit-codes .github/workflows

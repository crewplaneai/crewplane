version: 2

# One version-update PR for repository automation:
# GitHub Actions plus pre-commit hooks.
multi-ecosystem-groups:
  ci-tooling:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "America/Vancouver"
    labels:
      - "dependencies"
      - "status: needs-triage"
      - "area: ci"

updates:
  # One version-update PR for all Python dependencies.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Vancouver"
    labels:
      - "dependencies"
      - "status: needs-triage"
      - "area: packaging"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 3
    groups:
      python-dependencies:
        applies-to: version-updates
        patterns:
          - "*"

  # Included in the shared ci-tooling PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "ci-tooling"

  # Included in the same shared ci-tooling PR.
  - package-ecosystem: "pre-commit"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "ci-tooling"

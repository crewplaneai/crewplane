version: 2

multi-ecosystem-groups:
  ci-tooling:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "America/Vancouver"

updates:
  # One PR for all Python dependency updates.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Vancouver"
    labels:
      - "dependencies"
      - "status: needs-triage"
      - "area: packaging"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 3
    groups:
      python-dependencies:
        applies-to: version-updates
        patterns:
          - "*"

  # GitHub Actions and pre-commit share one ci-tooling PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - "dependencies"
      - "status: needs-triage"
      - "area: ci"
    patterns:
      - "*"
    multi-ecosystem-group: "ci-tooling"

  - package-ecosystem: "pre-commit"
    directory: "/"
    labels:
      - "dependencies"
      - "status: needs-triage"
      - "area: ci"
    patterns:
      - "*"
    multi-ecosystem-group: "ci-tooling"
